name: Active app verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: active-app-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and build active apps
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared TypeScript declarations
        run: pnpm run typecheck:libs

      - name: Typecheck storefront
        run: pnpm --filter @workspace/trynex-storefront typecheck

      - name: Typecheck API
        run: pnpm --filter @workspace/api-server typecheck

      - name: Run API tests
        env:
          JWT_SECRET: ci-only-spin-test-secret
        run: pnpm --filter @workspace/api-server test

      - name: Build storefront
        run: pnpm --filter @workspace/trynex-storefront build
